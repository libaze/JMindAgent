<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - JMindAgent 智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            --success-color: #10b981;
            --error-color: #ef4444;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --bg-color: #f9fafb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 700px;
        }

        .auth-banner {
            background: var(--primary-gradient);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .auth-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-banner-content {
            position: relative;
            z-index: 1;
        }

        .auth-banner h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .auth-banner p {
            font-size: 18px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .auth-banner-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .auth-form-container {
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            background: var(--bg-color);
            padding: 6px;
            border-radius: 12px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: white;
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .form-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-label .required {
            color: var(--error-color);
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 18px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-control:focus + .input-icon {
            color: #667eea;
        }

        .password-strength {
            margin-top: 8px;
            display: flex;
            gap: 4px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .strength-bar.weak { background: #ef4444; }
        .strength-bar.medium { background: #f59e0b; }
        .strength-bar.strong { background: #10b981; }

        .strength-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .agreement-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .agreement-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: #667eea;
        }

        .agreement-check a {
            color: #667eea;
            text-decoration: none;
        }

        .agreement-check a:hover {
            text-decoration: underline;
        }

        .verification-code {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .btn-send-code {
            padding: 14px 24px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-send-code:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .btn-send-code:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            z-index: 9999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-left: 4px solid var(--success-color); }
        .toast.error { border-left: 4px solid var(--error-color); }

        @media (max-width: 968px) {
            .auth-container {
                grid-template-columns: 1fr;
            }

            .auth-banner {
                display: none;
            }

            .auth-form-container {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- 左侧横幅 -->
        <div class="auth-banner">
            <div class="auth-banner-content">
                <div class="auth-banner-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <h1>JMindAgent</h1>
                <p>您的智能助手伙伴<br>让工作更高效，让生活更有趣</p>
            </div>
        </div>

        <!-- 右侧表单 -->
        <div class="auth-form-container">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">登录</button>
                <button class="auth-tab" onclick="switchTab('register')">注册</button>
            </div>

            <h2 class="form-title" id="formTitle">欢迎回来</h2>
            <p class="form-subtitle" id="formSubtitle">请输入您的账号信息</p>

            <!-- 登录表单 -->
            <form id="loginForm" style="display: block;">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user me-2"></i>用户名
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="loginUsername"
                               placeholder="请输入用户名" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                    <div class="error-message" id="loginUsernameError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock me-2"></i>密码
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="loginPassword"
                               placeholder="请输入密码" required>
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                    <div class="error-message" id="loginPasswordError"></div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt me-2"></i>登录
                </button>
            </form>

            <!-- 注册表单 -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user me-2"></i>用户名
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="registerUsername"
                               placeholder="3-20 位字符，支持字母、数字、下划线"
                               maxlength="20" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                    <div class="error-message" id="registerUsernameError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-phone me-2"></i>手机号
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="tel" class="form-control" id="registerPhone"
                               placeholder="请输入 11 位手机号"
                               maxlength="11" required>
                        <i class="fas fa-phone input-icon"></i>
                    </div>
                    <div class="error-message" id="registerPhoneError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-envelope me-2"></i>邮箱
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="email" class="form-control" id="registerEmail"
                               placeholder="example@email.com" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                    <div class="error-message" id="registerEmailError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-shield-alt me-2"></i>验证码
                        <span class="required">*</span>
                    </label>
                    <div class="verification-code">
                        <div class="input-wrapper" style="flex: 1;">
                            <input type="text" class="form-control" id="registerCode"
                                   placeholder="6 位验证码" maxlength="6" required>
                            <i class="fas fa-shield-alt input-icon"></i>
                        </div>
                        <button type="button" class="btn-send-code" id="sendCodeBtn" onclick="sendVerificationCode()">
                            获取验证码
                        </button>
                    </div>
                    <div class="error-message" id="registerCodeError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock me-2"></i>密码
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="password" class="form-control" id="registerPassword"
                               placeholder="6-20 位，包含字母和数字"
                               maxlength="20" required>
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar" data-level="0"></div>
                        <div class="strength-bar" data-level="0"></div>
                        <div class="strength-bar" data-level="0"></div>
                        <div class="strength-bar" data-level="0"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                    <div class="error-message" id="registerPasswordError"></div>
                </div>

                <div class="agreement-check">
                    <input type="checkbox" id="agreeCheck">
                    <label for="agreeCheck">
                        我已阅读并同意 <a href="#">《用户服务协议》</a> 和 <a href="#">《隐私政策》</a>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="registerBtn" disabled>
                    <i class="fas fa-user-plus me-2"></i>注册
                </button>
            </form>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle" id="toastIcon" style="font-size: 24px; color: #10b981;"></i>
        <span id="toastMessage"></span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        let countdown = 0;

        // 切换标签页
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const title = document.getElementById('formTitle');
            const subtitle = document.getElementById('formSubtitle');

            tabs.forEach(t => t.classList.remove('active'));

            if (tab === 'login') {
                tabs[0].classList.add('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                title.textContent = '欢迎回来';
                subtitle.textContent = '请输入您的账号信息';
            } else {
                tabs[1].classList.add('active');
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                title.textContent = '创建账号';
                subtitle.textContent = '填写以下信息开始使用';
            }

            clearErrors();
        }

        // 发送验证码
        async function sendVerificationCode() {
            const email = document.getElementById('registerEmail').value.trim();

            if (!validateEmail(email)) {
                showError('registerEmailError', '请输入正确的邮箱格式');
                return;
            }

            const btn = document.getElementById('sendCodeBtn');

            try {
                // 禁用按钮防止重复点击
                btn.disabled = true;

                // 调用后端 API 发送验证码
                const response = await axios.post('/api/user/send-verification-code', {
                    email: email,
                    purpose: 'register'  // 注册用途
                });

                if (response.data.code === 200) {
                    // 后端发送成功，显示提示
                    showToast('验证码已发送到您的邮箱', 'success');

                    // 从响应中获取配置信息（如果有）
                    const data = response.data.data;
                    const resendAfter = data?.resendAfter || 60; // 默认 60 秒

                    // 开始倒计时
                    countdown = resendAfter;
                    updateSendCodeButton();

                    const timer = setInterval(() => {
                        countdown--;
                        updateSendCodeButton();

                        if (countdown <= 0) {
                            clearInterval(timer);
                        }
                    }, 1000);
                } else {
                    // 后端返回错误
                    showToast(response.data.msg || '验证码发送失败', 'error');
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('验证码发送错误:', error);

                // 处理不同类型的错误
                let errorMessage = '验证码发送失败，请检查网络';

                if (error.response) {
                    // 后端返回了错误响应
                    const status = error.response.status;
                    const msg = error.response.data?.msg;

                    if (status === 400) {
                        // 参数错误（邮箱格式不正确、该邮箱已被注册等）
                        errorMessage = msg || '邮箱格式不正确或已被注册';
                        showError('registerEmailError', errorMessage);
                    } else if (status === 429) {
                        // 请求过于频繁
                        errorMessage = msg || '发送过于频繁，请稍后再试';
                    } else if (status === 500) {
                        // 服务器错误
                        errorMessage = msg || '服务器错误，请稍后重试';
                    } else {
                        errorMessage = msg || errorMessage;
                    }
                }

                showToast(errorMessage, 'error');
                btn.disabled = false;
            }
        }


        function updateSendCodeButton() {
            const btn = document.getElementById('sendCodeBtn');
            if (countdown > 0) {
                btn.disabled = true;
                btn.textContent = `${countdown}s 后重发`;
            } else {
                btn.disabled = false;
                btn.textContent = '获取验证码';
            }
        }

        // 密码强度检查
        document.getElementById('registerPassword').addEventListener('input', function(e) {
            const password = e.target.value;
            const strength = checkPasswordStrength(password);
            updatePasswordStrength(strength);
        });

        function checkPasswordStrength(password) {
            let strength = 0;

            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            return strength;
        }

        function updatePasswordStrength(strength) {
            const bars = document.querySelectorAll('.strength-bar');
            const text = document.getElementById('strengthText');

            bars.forEach((bar, index) => {
                bar.className = 'strength-bar';
                if (index < Math.min(strength, 4)) {
                    if (strength <= 2) bar.classList.add('weak');
                    else if (strength <= 4) bar.classList.add('medium');
                    else bar.classList.add('strong');
                }
            });

            const texts = ['太短', '较弱', '中等', '较强', '很强'];
            text.textContent = texts[Math.min(strength, 4)];
        }

        // 协议勾选检查
        document.getElementById('agreeCheck').addEventListener('change', function() {
            const btn = document.getElementById('registerBtn');
            btn.disabled = !this.checked;
        });

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username) {
                showError('loginUsernameError', '请输入用户名');
                return;
            }

            if (!password) {
                showError('loginPasswordError', '请输入密码');
                return;
            }

            try {
                // 使用 MD5 加密密码
                const encryptedPassword = CryptoJS.MD5(password).toString();
                const response = await axios.post('/api/user/login', {
                    username: username,
                    password: encryptedPassword
                });

                if (response.data.code === 200) {
                    const { token, userInfo } = response.data.data;
                    localStorage.setItem('token', token);
                    localStorage.setItem('userInfo', JSON.stringify(userInfo));
                    showToast('登录成功！', 'success');
                    setTimeout(() => {
                        window.location.href = '/chat';
                    }, 1000);
                } else {
                    showToast(response.data.msg || '登录失败', 'error');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showToast(error.response?.data?.msg || '登录失败，请检查网络', 'error');
            }
        });

        // 注册表单提交
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('registerUsername').value.trim();
            const phone = document.getElementById('registerPhone').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const code = document.getElementById('registerCode').value.trim();
            const password = document.getElementById('registerPassword').value;

            // 验证所有字段
            let hasError = false;

            if (!username || username.length < 3 || username.length > 20) {
                showError('registerUsernameError', '用户名长度为 3-20 位');
                hasError = true;
            }

            if (!validatePhone(phone)) {
                showError('registerPhoneError', '请输入正确的手机号');
                hasError = true;
            }

            if (!validateEmail(email)) {
                showError('registerEmailError', '请输入正确的邮箱格式');
                hasError = true;
            }

            if (!code || code.length !== 6) {
                showError('registerCodeError', '请输入 6 位验证码');
                hasError = true;
            }

            if (password.length < 6 || password.length > 20) {
                showError('registerPasswordError', '密码长度为 6-20 位');
                hasError = true;
            }

            if (hasError) return;

            try {
                // 使用 MD5 加密密码
                const encryptedPassword = CryptoJS.MD5(password).toString();

                const response = await axios.post('/api/user/register', {
                    username: username,
                    password: encryptedPassword,
                    phone: phone,
                    email: email,
                    verificationCode: code
                });

                if (response.data.code === 200) {
                    showToast('注册成功！请登录', 'success');
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginUsername').value = username;
                    }, 1500);
                } else {
                    showToast(response.data.msg || '注册失败', 'error');
                }
            } catch (error) {
                console.error('注册错误:', error);
                showToast(error.response?.data?.msg || '注册失败，请检查网络', 'error');
            }
        });

        // 实时验证
        document.getElementById('registerUsername').addEventListener('blur', function() {
            const value = this.value.trim();
            if (value && (value.length < 3 || value.length > 20)) {
                showError('registerUsernameError', '用户名长度为 3-20 位');
            } else {
                hideError('registerUsernameError');
            }
        });

        document.getElementById('registerPhone').addEventListener('blur', function() {
            if (!validatePhone(this.value)) {
                showError('registerPhoneError', '请输入正确的手机号');
            } else {
                hideError('registerPhoneError');
            }
        });

        document.getElementById('registerEmail').addEventListener('blur', function() {
            if (!validateEmail(this.value)) {
                showError('registerEmailError', '请输入正确的邮箱格式');
            } else {
                hideError('registerEmailError');
            }
        });

        // 工具函数
        function validatePhone(phone) {
            return /^1[3-9]\d{9}$/.test(phone);
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError(elementId) {
            const errorEl = document.getElementById(elementId);
            errorEl.classList.remove('show');
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msgEl = document.getElementById('toastMessage');

            msgEl.textContent = message;

            if (type === 'success') {
                icon.className = 'fas fa-check-circle';
                icon.style.color = '#10b981';
            } else {
                icon.className = 'fas fa-times-circle';
                icon.style.color = '#ef4444';
            }

            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 页面加载检查登录状态
        window.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            if (token) {
                window.location.href = '/chat';
            }
        });
    </script>
</body>
</html>
